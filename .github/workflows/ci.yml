# Pull request validation: builds Release. Publishes nothing.
# There is no unit test project; MVVMSample and MauiSample are manual samples.
name: CI

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore workloads
        run: dotnet workload restore System.Mvvm.slnx

      - name: Restore
        run: dotnet restore System.Mvvm.slnx -p:Configuration=Release

      - name: Build
        run: dotnet build System.Mvvm.slnx --configuration Release --no-restore
